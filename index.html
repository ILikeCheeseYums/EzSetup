<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EzSetup ⚡ Vanilla Tweaks for macOS Dev Environments</title>
  <meta name="description" content="Pick your macOS developer apps, CLI tools, and tweaks, and download a ready-to-run setup bundle.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            zinc: {
              950: '#09090b',
              900: '#121215',
              850: '#18181c',
              800: '#222227'
            }
          }
        }
      }
    };
  </script>

  <!-- JSZip & FileSaver CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #121215;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-32 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- Minimalist Top Header -->
  <header class="sticky top-0 z-30 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/80 px-4 sm:px-8 py-3.5">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-600/30">
          ⚡
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-tight">EzSetup</h1>
          <p class="text-[11px] text-zinc-400">Vanilla Tweaks for macOS Developer Environments</p>
        </div>
      </div>

      <!-- Search Input -->
      <div class="relative w-full sm:w-72">
        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-zinc-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <input
          type="text"
          id="search-input"
          placeholder="Search apps, CLI, tweaks..."
          class="w-full pl-8 pr-3 py-1.5 bg-zinc-900/80 border border-zinc-800 rounded-lg text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
        >
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 sm:px-8 mt-6">

    <!-- Presets Bar -->
    <div class="mb-8 p-3.5 rounded-xl bg-zinc-900/40 border border-zinc-800/80 flex flex-wrap items-center gap-2">
      <span class="text-xs text-zinc-400 font-medium mr-1">Quick Presets:</span>
      <div id="presets-container" class="flex flex-wrap items-center gap-2">
        <!-- Rendered by app.js -->
      </div>
    </div>

    <!-- Category Sections & Cards -->
    <div id="categories-container">
      <!-- Rendered by app.js -->
    </div>

  </main>

  <!-- Vanilla Tweaks Floating Action Bar -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-11/12 max-w-xl">
    <div class="bg-zinc-900/95 backdrop-blur-md border border-zinc-700/80 rounded-2xl p-2.5 sm:px-5 sm:py-3 shadow-2xl shadow-black/80 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="selected-count" class="text-xs sm:text-sm font-medium text-zinc-200">0 items selected</span>
      </div>

      <div class="flex items-center gap-2">
        <!-- Preview Button -->
        <button
          type="button"
          id="preview-btn"
          onclick="openPreview('brewfile')"
          class="px-3 py-1.5 text-xs font-medium text-zinc-300 hover:text-white bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-lg transition-colors"
        >
          Preview Files
        </button>

        <!-- Download Zip Primary Button -->
        <button
          type="button"
          id="download-zip-btn"
          onclick="onDownloadZipClick()"
          class="px-4 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 shadow-md shadow-indigo-600/30 rounded-lg transition-all flex items-center gap-1.5"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
          Download .zip
        </button>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div id="preview-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="px-5 py-3.5 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <h3 class="text-sm font-semibold text-white">Generated Bundle Files</h3>
          <!-- Tabs -->
          <div class="flex gap-2 border-b border-zinc-800 -mb-3.5">
            <button
              type="button"
              id="tab-brewfile"
              onclick="switchPreviewTab('brewfile')"
              class="px-3 py-1.5 text-xs font-medium text-white border-b-2 border-indigo-500"
            >
              Brewfile
            </button>
            <button
              type="button"
              id="tab-runscript"
              onclick="switchPreviewTab('script')"
              class="px-3 py-1.5 text-xs font-medium text-zinc-400 hover:text-zinc-200 border-b-2 border-transparent"
            >
              run.sh
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            id="copy-code-btn"
            onclick="copyPreviewCode()"
            class="px-2.5 py-1 text-xs text-zinc-300 hover:text-white bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-md transition-colors"
          >
            Copy
          </button>
          <button
            type="button"
            onclick="closePreview()"
            class="text-zinc-400 hover:text-white p-1"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Modal Body (Code View) -->
      <div class="p-4 overflow-y-auto flex-1 bg-zinc-950 font-mono text-xs text-zinc-300 leading-relaxed">
        <pre><code id="preview-code"></code></pre>
      </div>

      <!-- Modal Footer -->
      <div class="px-5 py-3 border-t border-zinc-800 bg-zinc-900/50 flex items-center justify-between text-xs text-zinc-400">
        <span>Included inside <code class="text-zinc-200">ezsetup-bundle.zip</code></span>
        <button
          type="button"
          onclick="onDownloadZipClick()"
          class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg text-xs transition-colors"
        >
          Download .zip
        </button>
      </div>
    </div>
  </div>

  <!-- EzSetup Scripts (No classes, separate files) -->
  <script src="js/data.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
